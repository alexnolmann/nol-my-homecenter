plugins { id 'com.android.application' }

android {
    namespace 'local.mediacentre.client'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'local.mediacentre.client'
        minSdk 19
        targetSdk 36
        versionCode 55
        versionName '0.12.35'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
    sourceSets { test.resources.srcDirs = ['../../contracts/v1/fixtures', '../../contracts/providers/h4'] }
    signingConfigs {
        debug {
            storeFile file('../../.local/signing/h0-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        if (System.getenv('MC_SIGNING_KEYSTORE')) {
            release {
                storeFile file(System.getenv('MC_SIGNING_KEYSTORE'))
                storePassword System.getenv('MC_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('MC_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('MC_SIGNING_KEY_PASSWORD')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            buildConfigField 'String', 'ENVIRONMENT', '"development"'
        }
        release {
            buildConfigField 'String', 'ENVIRONMENT', '"production"'
            minifyEnabled false
            if (System.getenv('MC_SIGNING_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
