name: Verify

on:
  # Automatic checks disabled at the owner's request. Keep explicit manual runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable CI service only; these are not deployment credentials.
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: mediacentre_ci_test
          MYSQL_USER: mc_ci
          MYSQL_PASSWORD: ephemeral-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      APP_ENV: development
      MC_TEST_DB_HOST: 127.0.0.1
      MC_TEST_DB_PORT: '3306'
      MC_TEST_DB_NAME: mediacentre_ci_test
      MC_TEST_DB_USER: mc_ci
      MC_TEST_DB_PASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, sodium, xml, simplexml, dom, bcmath
          coverage: none
          tools: composer:v2
      - name: Install locked PHP dependencies
        run: composer install --working-dir=server --no-interaction --prefer-dist --no-progress
      - name: Fixtures and real MySQL checks
        run: php server/tests/ci.php

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK and disposable debug signing key
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          mkdir -p .local/signing
          keytool -genkeypair -keystore .local/signing/h0-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=CI Debug,O=MediaCentre,C=XX'
      - name: JVM tests and both application variants
        working-directory: android
        run: sh ./gradlew --no-daemon :app:testDebugUnitTest :probe:testDebugUnitTest :app:assembleDebug :app:assembleRelease :probe:assembleDebug
      - name: Verify KitKat-compatible signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 19 android/app/build/outputs/apk/debug/app-debug.apk'
      - name: Release excludes local CA and debug probes
        shell: pwsh
        run: ./tools/android/check-apk.ps1
