# OSPanel 6 server-block fragment: .osp/nginx/mediacentre.miniw.conf.
# The panel supplies root, listen, server_name and $backend_ip/$backend_port.
autoindex off;
client_max_body_size 256m;
access_log off;

location = /assets/admin.css { try_files $uri =404; }
location = /assets/admin.js { try_files $uri =404; }
location = /admin { return 308 /admin/; }
location = /admin/ { rewrite ^ /admin/index.php last; }
location ^~ /api/v1/ { rewrite ^ /index.php last; }

# Only authenticated API responses may enter these routes via X-Accel-Redirect.
location ~ ^/__music_drive/([A-Za-z])/(.+)$ {
    internal;
    alias $1:/$2;
    default_type audio/mpeg;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~ ^/__music_unc/([^/]+)/([^/]+)/(.+)$ {
    internal;
    alias //$1/$2/$3;
    default_type audio/mpeg;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/(?:index|admin/index)[.]php$ {
    try_files $uri =404;
    include fastcgi.conf;
    include env/{host}.conf;
    fastcgi_pass $backend_ip:$backend_port;
    fastcgi_intercept_errors off;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    fastcgi_param MC_ADMIN_ALLOWED 1;
    fastcgi_param HTTP_HOST $http_host;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_IF_NONE_MATCH $http_if_none_match if_not_empty;
    fastcgi_param HTTP_IF_MATCH $http_if_match if_not_empty;
    fastcgi_param HTTP_X_MEDIACENTRE_SERVER_ID $http_x_mediacentre_server_id if_not_empty;
    fastcgi_param PHP_VALUE "memory_limit=768M\nmax_execution_time=300\nmax_input_time=300\npost_max_size=256M\nupload_max_filesize=24M\ndisplay_errors=Off\nlog_errors=On\nexpose_php=Off\ncgi.fix_pathinfo=0";
}

# No directory listing, arbitrary PHP, H0 probes or private/static file exposure.
location / { return 404; }
