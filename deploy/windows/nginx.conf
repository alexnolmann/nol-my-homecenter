pid nginx.pid;
error_log error.log warn;
events { worker_connections 256; }
http {
    map $http_x_mc_client_ip $mc_client_ip { default $remote_addr; ~^[0-9a-fA-F:.]+$ $http_x_mc_client_ip; }
    access_log off;
    default_type application/octet-stream;
    types { text/css css; text/javascript js; image/png png; image/svg+xml svg; }
    server {
        listen 127.0.0.1:__PORT__;
        server_name localhost;
        root "__PUBLIC__";
        index index.php;
        client_max_body_size 32k;
        location ~ ^/__music_drive/([A-Za-z])/(.+)$ {
            internal;
            alias $1:/$2;
            default_type audio/mpeg;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ ^/__music_unc/([^/]+)/([^/]+)/(.+)$ {
            internal;
            alias //$1/$2/$3;
            default_type audio/mpeg;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location ~ /\. { deny all; }
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REMOTE_ADDR $mc_client_ip;
            fastcgi_param MC_ADMIN_ALLOWED 0;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_IF_NONE_MATCH $http_if_none_match;
            fastcgi_param HTTP_IF_MATCH $http_if_match;
            fastcgi_param HTTP_X_MEDIACENTRE_SERVER_ID $http_x_mediacentre_server_id;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param REDIRECT_STATUS 200;
            fastcgi_pass 127.0.0.1:__FCGI_PORT__;
        }
    }
    # Trusted TLS proxy only. This port must remain loopback and never be published.
    server {
        listen 127.0.0.1:__ADMIN_PORT__;
        server_name admin-origin;
        root "__PUBLIC__";
        client_max_body_size 256m;
        location = /assets/admin.css { try_files $uri =404; }
        location = /assets/admin.js { try_files $uri =404; }
        location = /admin/ { rewrite ^ /admin/index.php last; }
        location = /admin/index.php {
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
            fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REMOTE_ADDR $mc_client_ip;
            fastcgi_param HTTP_COOKIE $http_cookie;
            fastcgi_param HTTPS on;
            fastcgi_param MC_ADMIN_ALLOWED 1;
            fastcgi_param REDIRECT_STATUS 200;
            fastcgi_pass 127.0.0.1:__FCGI_PORT__;
        }
        location / { return 403; }
    }
}
