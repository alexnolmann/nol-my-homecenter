# Linux transfer template; PHP-FPM execution is verified on the destination host.
# Mount certificates outside webroot as /run/secrets/server.pem and server.key.
events { worker_connections 256; }
http {
    access_log off;
    include /etc/nginx/mime.types;
    server {
        listen 443 ssl;
        ssl_certificate /run/secrets/server.pem;
        ssl_certificate_key /run/secrets/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /var/www/server/public_html;
        client_max_body_size 32k;
        location = /assets/admin.css { try_files $uri =404; }
        location = /assets/admin.js { try_files $uri =404; }
        location = /admin { return 308 /admin/; }
        location = /admin/ {
            client_max_body_size 256m;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
            fastcgi_param HTTPS on;
            fastcgi_param MC_ADMIN_ALLOWED 1;
            fastcgi_pass php:9000;
        }
        location ~ ^/api/v1/(pair|bootstrap|dashboard|weather|finance|radio/(stations(/[0-9a-fA-F-]{36})?|favorites/[0-9a-fA-F-]{36})|music/(libraries|browse|stream/[0-9a-fA-F-]{36}/[0-9]{1,18}/[0-9a-fA-F-]{36})|plugins/photoframe/(manifest|photos/[0-9a-fA-F-]{36}/[0-9a-f]{64})|client/(preferences|heartbeat|climate(/(config|report))?))$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_X_MEDIACENTRE_SERVER_ID $http_x_mediacentre_server_id;
            fastcgi_param MC_ADMIN_ALLOWED 0;
            fastcgi_pass php:9000;
        }
        # Only PHP can dispatch here after checking token, rights, indexed path and root containment.
        location ^~ /__music_file/ {
            internal;
            alias /;
            default_type audio/mpeg;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location / { return 403; }
    }
}
