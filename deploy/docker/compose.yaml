name: mediacentre-h1
services:
  nginx:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports: ["127.0.0.1:${MC_HTTP_PORT:-8081}:80"]
    volumes:
      - ../../server/public_html:/app/server/public_html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
  php:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    environment: &app-env
      APP_ENV: development
      MC_DEV_TOKEN: ${MC_DEV_TOKEN:?Generate the private compose env file first}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mediacentre_h1
      DB_USER: mediacentre_h1
      DB_PASSWORD: ${MC_DB_PASSWORD:?Generate the private compose env file first}
    volumes: ["runtime:/app/server/storage"]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "php", "bin/console.php", "check"]
      interval: 20s
      timeout: 8s
      retries: 3
  maintenance:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    command: ["php", "bin/console.php", "maintenance"]
    environment: *app-env
    volumes: ["runtime:/app/server/storage"]
    depends_on:
      mysql: {condition: service_healthy}
    stop_grace_period: 15s
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    environment:
      MYSQL_DATABASE: mediacentre_h1
      MYSQL_USER: mediacentre_h1
      MYSQL_PASSWORD: ${MC_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MC_DB_ROOT_PASSWORD:?Generate the private compose env file first}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql-data:
  runtime:
